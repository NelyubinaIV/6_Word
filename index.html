  <div class="space-noise" aria-hidden="true"></div>

      <div class="login-story">
        <div class="brand"><span class="brand-mark">🚀</span><span>Космическая<br>академия слов</span></div>
        <div class="robot-frame"><img src="./assets/illustrations/robot-guide.png" alt="Робот-проводник Академии"></div>

      </div>

        <div class="login-card">

          <div style="padding:16px;text-align:center;border:1px solid rgba(126,160,236,.25);border-radius:13px;color:#aebbdc">Загрузка…</div>
          <noscript><div class="form-error">Для работы Академии необходимо включить JavaScript.</div></noscript>
        </div>
      </div>
    </section>
